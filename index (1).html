<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VX-720 Online Help (prototype)</title>
<style>
:root{--navy:#0A2540;--blue:#1565D8;--sky:#E8F1FD;--line:#D3DFF0;--ink:#16202E;--mute:#5A6678;--bg:#F6F9FD;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 var(--sans);color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;gap:16px;align-items:center;padding:12px 20px;flex-wrap:wrap}
header b{font-size:1.05rem;letter-spacing:-.01em}header b span{color:#9CC2F7;font-weight:600}
#q{flex:1;min-width:180px;max-width:460px;padding:10px 14px;border:0;border-radius:8px;font:inherit}
select{padding:9px 10px;border-radius:8px;border:0;font:inherit}
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr) 230px;gap:0;max-width:1320px;margin:0 auto}
nav{padding:22px 16px;border-right:1px solid var(--line);height:calc(100vh - 58px);position:sticky;top:58px;overflow:auto}
nav h4{margin:18px 0 6px;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
nav a{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.93rem}
nav a:hover{background:var(--sky)}nav a.on{background:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font:600 .78rem var(--sans);cursor:pointer}.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.badge{flex:none;font:700 .62rem/1 var(--sans);padding:3px 6px;border-radius:4px;margin-top:4px;color:#fff}
.Task{background:#1565D8}.Concept{background:#0E7C6B}.Reference{background:#5A6678}.Troubleshooting{background:#B7791F}
main{padding:34px 40px 80px;min-width:0}
main h1{font-size:2rem;line-height:1.15;margin:8px 0 8px;letter-spacing:-.02em}
.sum{color:var(--mute);font-size:1.08rem;margin:0 0 22px}
.cond{background:#FFF7E0;border-left:4px solid #E0A800;padding:10px 14px;border-radius:0 8px 8px 0;margin:0 0 18px;font-size:.95rem}
.sme{background:#EEF3FA;border:1px dashed #9FB4D0;color:#33496A;padding:10px 14px;border-radius:8px;margin:18px 0;font-size:.9rem}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}ol.steps li{counter-increment:s;position:relative;padding:12px 14px 12px 52px;background:#fff;border:1px solid var(--line);border-radius:10px;margin:0 0 10px}
ol.steps li:before{content:counter(s);position:absolute;left:14px;top:11px;width:26px;height:26px;border-radius:7px;background:var(--blue);color:#fff;font-weight:700;text-align:center;line-height:26px}
code{background:var(--sky);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font:600 .92em ui-monospace,Menlo,Consolas,monospace}
.ic{background:#fff;color:var(--mute);font-style:italic;font-size:.85em;border:1px solid var(--line);border-radius:5px;padding:0 5px}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-size:.85rem}td{padding:8px 10px;border-top:1px solid var(--line)}
aside{padding:34px 16px;border-left:1px solid var(--line)}aside h4{margin:0 0 8px;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}aside a{display:block;padding:5px 0;color:var(--blue);text-decoration:none;font-size:.92rem}
.note{margin-top:30px;font-size:.82rem;color:var(--mute)}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}nav,aside{height:auto;position:static;border:0}nav{max-height:260px}main{padding:24px 18px 60px}}
</style>
</head>
<body>
<header><b>VX-720 <span>Help</span></b><input id="q" type="search" placeholder="Search the help (for example: follow-me, DISA, battery)" aria-label="Search"><label>Region <select id="reg"><option value="def">Default</option><option value="uk">United Kingdom</option><option value="na">North America</option><option value="de">Germany, Netherlands, Sweden</option></select></label></header>
<div class="wrap"><nav id="nav" aria-label="Topics"></nav><main id="main"></main><aside id="rel"></aside></div>
<script>
const K={fmi:{def:'*21*',uk:'*2*'},fmic:{def:'#21#',uk:'#2#'},fme:{def:'*22#',na:'*23#'},fmec:{def:'#22#',na:'#23#'},disa:{def:'*75*',de:'*72*'},pn:{def:'*10*'},pnc:{def:'#10#'}};
const I=t=>`<span class="ic">${t}</span>`,C=k=>`<code data-k="${k}"></code>`;
const S=a=>'<ol class="steps">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ol>';
const ADM='<div class="cond"><b>Depends on your system.</b> This feature needs to be programmed via the Desk PDM or the CPDM. Contact your system administrator.</div>';
const SME=t=>`<div class="sme"><b>For SME validation:</b> ${t}</div>`;
const WAIT='Wait for the call timer to start in the display.';
const T=[
{id:'c_overview',t:'Concept',g:'Stay reachable',n:'Ways of forwarding calls',s:'There are several ways of forwarding calls: diversion, follow-me and personal number.',b:'<p>Calls to your extension can be forwarded in different ways. Diversion sends calls to an answering position of your choice. Follow-me diverts all calls to an internal or external number. Personal number lets you be reached on your office number when out of the office, using search profiles.</p>'+SME('The source describes each method but does not say when to prefer one over another.'),r:['c_diversion','c_followme','c_personal']},
{id:'c_diversion',t:'Concept',g:'Stay reachable',n:'Diversion',s:'All calls, calls when busy or calls at no answer can be diverted to other numbers.',b:'<p>All calls to your extension are diverted to an internal or external answering position of your choice. You select the position when you activate the diversion.</p><p>A soft key or a hot key can be pre-programmed with a short cut to the Diversion function.</p>'+ADM,r:['t_div_on','t_div_off','t_pos_add','t_pos_edit','t_pos_del']},
{id:'c_followme',t:'Concept',g:'Stay reachable',n:'Follow-me',s:'All calls to your extension are diverted to a number of your choice.',b:'<p>With Follow-me, all calls to your extension are diverted to an extension within the private network (internal) or, if allowed, to an external number.</p><p>While Follow-me is active, the display shows a &gt; after your number and a special dial tone is heard. Your phone can still be used for outgoing calls.</p><div class="cond"><b>Depends on your system.</b> External follow-me is available only if it is allowed.</div>'+SME('What does "allowed" mean (user right or exchange configuration), and how can the user check it?'),r:['t_fmi_on','t_fmi_off','t_fme_on','t_fme_off']},
{id:'c_personal',t:'Concept',g:'Stay reachable',n:'Personal number and search profiles',s:'Be reached on your office number even when you are out of the office.',b:'<p>Depending on your office exchange, you have either one individual search profile (standard) or a choice of five (optional). When the feature is active, incoming calls are transferred to your selected phones or backup services in the selected order.</p><p>Your search profile is programmed or modified by your system administrator. You can activate or cancel it from your office phone or from an external phone.</p><div class="cond"><b>Depends on your system.</b> The number of profiles depends on the functionality of your office exchange.</div>',r:['c_design','t_pn_on','t_pn_off','t_pn_ext_on','t_pn_ext_off','t_profile_req']},
{id:'c_design',t:'Concept',g:'Stay reachable',n:'Designing search profiles',s:'Good practice when you plan the answering positions of a profile.',b:'<ul><li>Avoid ring times longer than 45 seconds. Callers usually hang up after 3 to 6 rings. The maximum is 60 seconds.</li><li>Allow time to react: up to 15 seconds on a desk or cordless phone, and 20 to 25 seconds on a mobile phone.</li><li>End every profile with an answering position (Voice Mail or operator/secretary), otherwise calls may go unanswered.</li><li>Decide what happens while you are busy: diversion to Voice Mail or to the operator.</li><li>An answering machine or fax used as an early answering position can interrupt the search.</li><li>With a single profile, use only your 2 to 3 most used positions.</li><li>With 1 to 5 profiles, use as few positions as possible per profile (for example In office, At home, Traveling, Absent).</li></ul>',r:['t_profile_req','c_personal']},
{id:'t_div_on',t:'Task',g:'Stay reachable',n:'Divert calls to another extension',s:'Send all calls, busy calls or unanswered calls to another number.',b:ADM+S(['Press <b>Menu</b> and select the <b>Calls</b> tab.','Go to the <b>Call services</b> menu with the navigation key and press the confirmation button, or <b>Select</b>.','Select <b>Divert calls</b>, then <b>Internal</b> or <b>External</b>. A list of predefined names and numbers appears if the phone is pre-programmed via the PDM.','Select <b>Activate</b> and enter the number to dial, or navigate to the right number in the list.','Press <b>OK</b>.'])+SME('Prerequisites and the expected result are not stated in the source.'),r:['c_diversion','t_div_off','t_pos_add']},
{id:'t_div_off',t:'Task',g:'Stay reachable',n:'Cancel diversion',s:'Stop diverting your calls.',b:S(['Select <b>Deactivate</b>.','Press the confirmation button or <b>OK</b>.']),r:['t_div_on']},
{id:'t_pos_add',t:'Task',g:'Stay reachable',n:'Add a predefined answering position',s:'Add a new position to the list of diversion targets.',b:ADM+S(['Press <b>Menu</b> and select <b>Calls</b>.','Go to <b>Call services</b> and select <b>Divert calls</b>.','Press <b>Add</b>. If needed, select <b>Internal</b> or <b>External</b> and confirm '+I('confirm key')+'.','Enter the number of the answering position. You can dial it, or use the Phonebook or the Call list.','Confirm '+I('confirm key')+'.']),r:['t_pos_edit','t_pos_del','t_div_on']},
{id:'t_pos_edit',t:'Task',g:'Stay reachable',n:'Edit a predefined answering position',s:'Change a position in the list of diversion targets.',b:ADM+S(['Press <b>Menu</b> and select <b>Calls</b>.','Go to <b>Call services</b>, select <b>Divert calls</b>, then <b>Edit</b>.','Go to the position you want and press '+I('confirm key')+'.','Edit the answering position.','Press <b>Save</b>.']),r:['t_pos_add','t_pos_del']},
{id:'t_pos_del',t:'Task',g:'Stay reachable',n:'Delete a predefined answering position',s:'Remove a position from the list of diversion targets.',b:ADM+S(['Press <b>Menu</b> and select <b>Calls</b>.','Go to <b>Call services</b>, select <b>Divert calls</b>, then <b>Delete</b>. A list of positions is displayed.','Select the position and press <b>Delete</b>.','Confirm by pressing <b>Yes</b>.']),r:['t_pos_add','t_pos_edit']},
{id:'t_fmi_on',t:'Task',g:'Stay reachable',n:'Activate internal follow-me',s:'Send all calls to an extension within the private network.',b:S(['Press '+C('fmi')+' and enter the answering position number.','Press <code>#</code> and the off-hook key '+I('off-hook icon')+'. '+WAIT,'Press the end key '+I('end icon')+' to finish.'])+SME('Prerequisites are not stated. The source says the display shows &gt; after your number and a special dial tone is heard during follow-me: confirm this as the success criterion.'),r:['c_followme','t_fmi_off','r_codes']},
{id:'t_fmi_off',t:'Task',g:'Stay reachable',n:'Cancel internal follow-me',s:'Stop forwarding calls to the internal extension.',b:S(['Press '+C('fmic')+' and the off-hook key '+I('off-hook icon')+'. '+WAIT,'Press the end key '+I('end icon')+' to finish.']),r:['t_fmi_on','r_codes']},
{id:'t_fme_on',t:'Task',g:'Stay reachable',n:'Activate external follow-me',s:'Send all calls to an external number.',b:'<div class="cond"><b>Depends on your system.</b> Available only if external follow-me is allowed.</div>'+S(['Press '+C('fme')+'.','Dial the digit or digits to get a line, then enter the external number.','Press <code>#</code> and the off-hook key '+I('off-hook icon')+'. '+WAIT,'Press the end key '+I('end icon')+' to finish.']),r:['c_followme','t_fme_off','r_codes']},
{id:'t_fme_off',t:'Task',g:'Stay reachable',n:'Cancel external follow-me',s:'Stop forwarding calls to the external number.',b:S(['Press '+C('fmec')+'.','Press the off-hook key '+I('off-hook icon')+'. '+WAIT,'Press the end key '+I('end icon')+' to finish.']),r:['t_fme_on','r_codes']},
{id:'t_pn_on',t:'Task',g:'Stay reachable',n:'Activate or change profile from your office phone',s:'Switch on the personal number feature or select another search profile.',b:'<div class="cond"><b>Depends on your system.</b> You have one profile (standard) or up to five (optional).</div>'+S(['Press '+C('pn')+'.','Press the search profile digit (1 to 5).','Press <code>#</code> and the off-hook key '+I('off-hook icon')+'. '+WAIT,'Press the end key '+I('end icon')+' to finish.'])+'<div class="cond">If another party (a colleague or operator) is in the active profile, tell them about your absence. If Voice Mail is in the profile, update your greeting with Absence Information.</div>',r:['c_personal','t_pn_off','t_pn_ext_on']},
{id:'t_pn_off',t:'Task',g:'Stay reachable',n:'Cancel personal number from your office phone',s:'Switch off the personal number feature.',b:S(['Press '+C('pnc')+'.','Press the off-hook key '+I('off-hook icon')+'. '+WAIT,'Press the end key '+I('end icon')+' to finish.']),r:['t_pn_on']},
{id:'t_pn_ext_on',t:'Task',g:'Stay reachable',n:'Activate or change profile from an external phone',s:'Use DISA to select a search profile when you are away.',b:'<div class="cond"><b>Before you start.</b> The external phone must be a push-button type with the <code>#</code> and <code>*</code> keys, or a mobile phone adapted for dial tone pulses (DTMF).</div>'+S(['Call the DISA function at your office. Wait for dial tone.','Press '+C('disa')+'.','Enter the Authorization Code and press <code>*</code>.','Dial your own extension number and press <code>#</code>. Wait for dial tone.','Press '+C('pn')+'.','Dial your own extension number and press <code>*</code>.','Press the search profile digit (1 to 5).','Replace the handset.']),r:['t_pn_ext_off','t_pn_on','r_codes']},
{id:'t_pn_ext_off',t:'Task',g:'Stay reachable',n:'Cancel personal number from an external phone',s:'Use DISA to switch the feature off when you are away.',b:'<div class="cond"><b>Before you start.</b> Same requirements as for activation: push-button phone with <code>#</code> and <code>*</code>, or a DTMF mobile phone.</div>'+S(['Call the DISA function at your office. Wait for dial tone.','Press '+C('disa')+'.','Dial the Authorization Code and press <code>*</code>.','Dial your own extension number and press <code>#</code>.','Press <code>#10*</code>.','Dial your own extension number and press <code>#</code>.','Replace the handset.']),r:['t_pn_ext_on']},
{id:'t_profile_req',t:'Task',g:'Stay reachable',n:'Request a new or changed search profile',s:'Your system administrator installs or changes your profiles.',b:S(['Copy the search profile setting form.','Fill in your new or changed profiles.','Hand the form to your system administrator.'])+'<div class="cond">If a profile handling application is connected to your system, you can edit profiles via the Intranet. See the separate instructions for that application.</div>'+SME('The source text is cut at the hand-over step: confirm the exact wording of the procedure.'),r:['c_design','c_personal']},
{id:'r_codes',t:'Reference',g:'Reference',n:'Call forwarding codes',s:'Feature codes by region. Use the Region selector at the top to change the codes shown in the steps.',b:'<table><tr><th>Function</th><th>Default</th><th>Variant</th></tr><tr><td>Internal follow-me, activate</td><td><code>*21*</code></td><td>United Kingdom: <code>*2*</code></td></tr><tr><td>Internal follow-me, cancel</td><td><code>#21#</code></td><td>United Kingdom: <code>#2#</code></td></tr><tr><td>External follow-me, activate</td><td><code>*22#</code></td><td>North America: <code>*23#</code></td></tr><tr><td>External follow-me, cancel</td><td><code>#22#</code></td><td>North America: <code>#23#</code></td></tr><tr><td>Personal number, activate / cancel</td><td><code>*10*</code> / <code>#10#</code></td><td>-</td></tr><tr><td>DISA access to profiles</td><td><code>*75*</code></td><td>Germany, Netherlands, Sweden: <code>*72*</code></td></tr></table>'+SME('Cross-check with the Telephony Function Codes chapter of the source.'),r:['t_fmi_on','t_fme_on','t_pn_ext_on']},
{id:'x_nodisplay',t:'Troubleshooting',g:'Troubleshooting',n:'No display',s:'The screen stays blank.',b:'<h3>Cause</h3><p>The battery level is low or the phone is defective.</p><h3>Remedy</h3><p>Charge the battery or contact your system administrator.</p>',r:[]},
{id:'x_signal',t:'Troubleshooting',g:'Troubleshooting',n:'Signal strength icon off',s:'The signal strength icon is not shown.',b:'<h3>Cause</h3><p>Out of system coverage area or the phone is defective.</p><h3>Remedy</h3><p>Enter the coverage area or contact your system administrator.</p>',r:[]},
{id:'x_2s',t:'Troubleshooting',g:'Troubleshooting',n:'Call is switched off after 2 seconds',s:'The call ends almost immediately.',b:'<h3>Cause</h3><p>The phone is defective.</p><h3>Remedy</h3><p>Contact your system administrator.</p>',r:[]},
{id:'x_pin',t:'Troubleshooting',g:'Troubleshooting',n:'The display shows "Enter PIN"',s:'The phone asks for a PIN code.',b:'<h3>Cause</h3><p>The telephone lock is activated.</p><h3>Remedy</h3><p>Enter the required PIN code. If the PIN code is lost, contact your system administrator.</p>',r:[]},
{id:'x_noaccess',t:'Troubleshooting',g:'Troubleshooting',n:'The display shows "No access"',s:'The network is in range but the phone cannot use it.',b:'<h3>Cause</h3><p>The network is in range, but there are no access rights.</p><h3>Remedy</h3><p>Switch the telephone off and on again, or contact your system administrator.</p>',r:[]},
{id:'x_battery',t:'Troubleshooting',g:'Troubleshooting',n:'The display shows "Battery low"',s:'The battery level is low.',b:'<h3>Cause</h3><p>The battery level is low.</p><h3>Remedy</h3><p>Charge the battery.</p>',r:[]},
{id:'x_phonebook',t:'Troubleshooting',g:'Troubleshooting',n:'"Phonebook is not available at the moment"',s:'The central phonebook does not respond.',b:'<h3>Cause</h3><p>The phonebook does not respond or is not available at the moment.</p><h3>Remedy</h3><p>Try again later. If the fault persists, contact your system administrator.</p>',r:[]},
{id:'x_vm',t:'Troubleshooting',g:'Troubleshooting',n:'"Voice mail number not defined"',s:'No voice mail number is set in the phone.',b:'<h3>Cause</h3><p>There is no Voice mail number defined in the telephone.</p><h3>Remedy</h3><p><i>Responsible: system administrator.</i> Define a Voice mail number via the Desk PDM or the CPDM.</p>',r:[]}];
T.forEach(x=>{x.r=x.r||[]});const B={};T.forEach(x=>B[x.id]=x);
const nav=document.getElementById('nav'),main=document.getElementById('main'),rel=document.getElementById('rel'),q=document.getElementById('q'),reg=document.getElementById('reg');let type='All';
function fill(){document.querySelectorAll('code[data-k]').forEach(e=>{const m=K[e.dataset.k];e.textContent=m[reg.value]||m.def})}
function list(){const s=q.value.toLowerCase();const G={};T.filter(x=>(type=='All'||x.t==type)&&(!s||(x.n+x.s+x.b).toLowerCase().includes(s))).forEach(x=>(G[x.g]=G[x.g]||[]).push(x));
nav.innerHTML='<div class="chips">'+['All','Task','Concept','Reference','Troubleshooting'].map(c=>`<button class="${c==type?'on':''}" data-t="${c}">${c}</button>`).join('')+'</div>'+(Object.keys(G).length?Object.entries(G).map(([g,a])=>`<h4>${g}</h4>`+a.map(x=>`<a href="#${x.id}" class="${location.hash=='#'+x.id?'on':''}"><span class="badge ${x.t}">${x.t.slice(0,4).toUpperCase()}</span>${x.n}</a>`).join('')).join(''):'<p>No topic found.</p>');
nav.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{type=b.dataset.t;list()})}
function show(){const id=location.hash.slice(1)||'c_overview',x=B[id]||B.c_overview;
main.innerHTML=`<span class="badge ${x.t}" style="display:inline-block;font-size:.72rem">${x.t.toUpperCase()}</span><h1>${x.n}</h1><p class="sum">${x.s}</p>${x.b}<p class="note">Prototype built from the anonymized VX-720 guide. It covers chapter 12 (call forwarding) and a selection of troubleshooting entries.</p>`;
rel.innerHTML=x.r.length?'<h4>Related topics</h4>'+x.r.map(i=>`<a href="#${i}">${B[i].n}</a>`).join(''):'';fill();list();window.scrollTo(0,0)}
q.oninput=list;reg.onchange=fill;addEventListener('hashchange',show);show();
</script>
</body>
</html>
